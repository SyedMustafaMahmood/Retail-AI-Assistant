<div class="page">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand">
      <h1>E3 Retail</h1>
      <span class="nav-subtitle">Retail AI Assistant</span>
    </div>

    <div class="nav-links">
      <a (click)="goToProducts()">Products</a>
      <a (click)="goToTickets()">My Tickets</a>
      <a class="active">Policy Help</a>
    </div>

    <div class="nav-user" *ngIf="currentUser">
      <span class="user-name">{{ currentUser.name }}</span>
      <span class="user-role">{{ currentUser.role }}</span>
      <button class="logout-btn" (click)="logout()">Sign out</button>
    </div>
  </nav>

  <div class="content">

    <!-- Header -->
    <div class="page-header">
      <div>
        <h2>Policy Assistant</h2>
        <p class="page-subtitle">Ask anything about our refund, return and exchange policies</p>
      </div>
    </div>

    <!-- Chat Window -->
    <div class="chat-container">

      <!-- Messages -->
      <div class="messages-area">
        <div
          class="message"
          *ngFor="let message of messages"
          [class.user-message]="message.role === 'user'"
          [class.assistant-message]="message.role === 'assistant'"
        >
          <div class="message-bubble">
            <p>{{ message.text }}</p>
          </div>
          <span class="message-label">
            {{ message.role === 'user' ? 'You' : 'Aria' }}
          </span>
        </div>

        <!-- Loading indicator -->
        <div class="message assistant-message" *ngIf="isLoading">
          <div class="message-bubble typing">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span class="message-label">Aria</span>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <textarea
          [(ngModel)]="query"
          (keydown)="onKeyPress($event)"
          placeholder="Ask about refunds, returns, exchanges..."
          rows="1"
        ></textarea>
        <button
          class="send-btn"
          (click)="askQuestion()"
          [disabled]="!query.trim() || isLoading"
        >
          →
        </button>
      </div>

    </div>

    <!-- Quick Questions -->
    <div class="quick-questions">
      <p class="quick-label">Quick questions:</p>
      <div class="quick-btns">
        <button class="quick-btn" (click)="query = 'What is the refund policy?'">
          Refund policy
        </button>
        <button class="quick-btn" (click)="query = 'How many days to return a product?'">
          Return window
        </button>
        <button class="quick-btn" (click)="query = 'Can I exchange a product?'">
          Exchange policy
        </button>
        <button class="quick-btn" (click)="query = 'How long does a refund take?'">
          Refund timeline
        </button>
      </div>
    </div>

  </div>
</div>
